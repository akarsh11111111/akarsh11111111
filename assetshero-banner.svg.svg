<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Electric Blue / Violet Accent Gradients -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#050508" stop-opacity="0.95" />
    </linearGradient>

    <!-- Subtle Architectural Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font: 700 46px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; fill: #F8FAFC; letter-spacing: -1.2px; }
    .role { font: 600 13px 'JetBrains Mono', 'Fira Code', monospace; fill: #38BDF8; letter-spacing: 3.5px; text-transform: uppercase; }
    .desc { font: 400 16px 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #94A3B8; letter-spacing: 0.2px; }
    .mono { font: 500 12px 'JetBrains Mono', 'Fira Code', monospace; fill: #64748B; }
    
    .float-slow { animation: float 6s ease-in-out infinite; }
    .float-mid { animation: float 4.5s ease-in-out infinite 1s; }
    .float-fast { animation: float 3.5s ease-in-out infinite 0.5s; }
    .pulse { animation: pulse 4s ease-in-out infinite; }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
  </style>

  <!-- Background & Grid -->
  <rect width="1200" height="320" rx="12" fill="url(#bg)" stroke="#1E293B" stroke-width="2" />
  <rect width="1200" height="320" rx="12" fill="url(#grid)" />

  <!-- Ambient Lighting Orbs -->
  <circle cx="950" cy="160" r="140" fill="#38BDF8" opacity="0.08" filter="url(#glow)" />
  <circle cx="820" cy="110" r="100" fill="#6366F1" opacity="0.1" filter="url(#glow)" />

  <!-- LEFT: Typography & Identity -->
  <g transform="translate(70, 0)">
    <!-- Status Indicator -->
    <circle cx="8" cy="76" r="4" fill="#38BDF8" class="pulse" />
    <text x="24" y="80" class="role">SYSTEMS & SOFTWARE ENGINEERING</text>

    <!-- Name -->
    <text x="0" y="142" class="title">Akarsh Vidyarthi</text>

    <!-- Tagline -->
    <text x="0" y="182" class="desc">Architecting intelligent systems, high-throughput backends, and</text>
    <text x="0" y="206" class="desc">transforming complex algorithmic problems into elegant software.</text>

    <!-- Accent Bar -->
    <rect x="0" y="236" width="90" height="3" rx="1.5" fill="url(#accent)" />
    <text x="108" y="241" class="mono">// C++ • TypeScript • Python • Distributed Systems • AI</text>
  </g>

  <!-- RIGHT: 3D Isometric Systems Sculpture -->
  <g transform="translate(880, 165)">
    <!-- Connecting Data Lines -->
    <path d="M -120 40 L 0 -20 L 120 40 L 0 100 Z" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 4" class="pulse" />
    <line x1="0" y1="-110" x2="0" y2="100" stroke="#6366F1" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Base Platform Node -->
    <g class="float-slow">
      <polygon points="0,10 95,55 0,100 -95,55" fill="url(#cubeTop)" stroke="#38BDF8" stroke-width="1.2" />
      <polygon points="-95,55 0,100 0,122 -95,77" fill="url(#cubeLeft)" stroke="#1E293B" stroke-width="1" />
      <polygon points="95,55 0,100 0,122 95,77" fill="url(#cubeRight)" stroke="#1E293B" stroke-width="1" />
    </g>

    <!-- Middle Compute Layer -->
    <g class="float-mid">
      <polygon points="0,-35 70,0 0,35 -70,0" fill="url(#cubeTop)" stroke="#818CF8" stroke-width="1.5" />
      <polygon points="-70,0 0,35 0,60 -70,25" fill="url(#cubeLeft)" stroke="#334155" stroke-width="1" />
      <polygon points="70,0 0,35 0,60 70,25" fill="url(#cubeRight)" stroke="#1E293B" stroke-width="1" />
    </g>

    <!-- Top Core Intelligence Cube -->
    <g class="float-fast">
      <polygon points="0,-85 42,-64 0,-43 -42,-64" fill="url(#cubeTop)" stroke="#38BDF8" stroke-width="1.8" />
      <polygon points="-42,-64 0,-43 0,-5 -42,-26" fill="url(#cubeLeft)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />
      <polygon points="42,-64 0,-43 0,-5 42,-26" fill="url(#cubeRight)" stroke="#6366F1" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="0" cy="-64" r="3.5" fill="#F8FAFC" />
    </g>

    <!-- Orbiting Satellite Nodes -->
    <g class="float-fast">
      <circle cx="-115" cy="-15" r="4" fill="#38BDF8" />
      <line x1="-115" y1="-15" x2="-70" y2="0" stroke="#38BDF8" stroke-width="0.8" opacity="0.5" />
    </g>
    <g class="float-mid">
      <circle cx="115" cy="-25" r="4" fill="#C084FC" />
      <line x1="115" y1="-25" x2="70" y2="0" stroke="#C084FC" stroke-width="0.8" opacity="0.5" />
    </g>
  </g>
</svg>